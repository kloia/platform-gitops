apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
resources:
  - ../../base/

commonAnnotations:
  gitops.kloia/overlay-path: "overlays/preprod"

replacements:
  - source:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: bootstrap
      namespace: argocd
      fieldPath: "metadata.annotations.[gitops.kloia/overlay-path]"
    targets:
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          name: clusters
        fieldPaths:
          - "spec.source.path"
        options:
          delimiter: "/"
          index: 1
      - select:
          group: argoproj.io
          version: v1alpha1
          kind: Application
          labelSelector: "!exclude"
        fieldPaths:
          - "spec.source.path"
        options:
          delimiter: "/"
          index: 2
